pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    }
}

dependencyResolutionManagement {
    // ForgeGradle installs its generated Minecraft repository on each userdev project.
    repositoriesMode.set(RepositoriesMode.PREFER_PROJECT)
    repositories {
        mavenCentral()
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://maven.tterrag.com/' }
    }
}

rootProject.name = 'samcnpc'
include 'samcnpc-core', 'samcnpc-behavior', 'samcnpc-llm'
